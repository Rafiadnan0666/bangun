name: bangun
description: "Bangun — alarms you stop with a scan or a math grind. All ML runs on-device."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Alarm engine — native scheduling, looping audio, full-screen intent.
  alarm: ^5.15.0

  # Real-time scan challenge — camera frames -> COCO-SSD (MobileNet) TFLite.
  camera: ^0.12.1
  tflite_flutter: ^0.12.1

  # State + storage.
  provider: ^6.1.5
  shared_preferences: ^2.5.6
  collection: ^1.19.1

  # Spotify handoff at ring time.
  url_launcher: ^6.3.3

  # In-editor ring sound preview (tone / custom file / spotify fallback).
  audioplayers: ^6.5.0

  path_provider: ^2.1.5

  # Custom-file ringtone picker.
  file_picker: ^10.3.7

  # UI look. 9.x returns `material_ui` types that this Flutter SDK's ThemeData
  # can't accept — stay on the 6.x line for the classic flutter/material types.
  google_fonts: ^6.2.1

  # Screen stays awake on the ring/challenge screens.
  wakelock_plus: ^1.5.2

  # Notification / exact-alarm / camera permissions.
  # NOTE: 13.x pulls permission_handler_android >=14 which demands
  # compileSdk 37 while AGP 9.1 recommends max 36 — stay on 12.0.3
  # (android module 13.x compiles against SDK 35) until AGP supports 37.
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/sounds/
